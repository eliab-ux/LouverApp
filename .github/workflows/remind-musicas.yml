name: Lembrete de Músicas para Ministrantes

on:
  schedule:
    # 13h UTC = 10h horário de Brasília (UTC-3)
    - cron: '0 13 * * *'
  workflow_dispatch: # permite rodar manualmente pelo GitHub

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar secret configurado
        run: |
          if [ -z "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            echo "ERRO: Secret SUPABASE_SERVICE_ROLE_KEY não está configurado no repositório."
            exit 1
          fi
          echo "Secret configurado OK."

      - name: Chamar Edge Function remind_musicas_ministrantes_v2
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" -X POST \
            'https://wajbaxzpehfkapqndfwv.supabase.co/functions/v1/remind_musicas_ministrantes_v2' \
            -H 'Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}' \
            -H 'Content-Type: application/json' \
            -d '{}')

          echo "HTTP Status: $HTTP_STATUS"
          echo "Resposta:"
          cat /tmp/response.json

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "ERRO: Edge function retornou status $HTTP_STATUS"
            exit 1
          fi
          echo "Edge function executada com sucesso."
